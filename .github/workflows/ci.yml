name: KeiOS CI

# Do healthcheck
# Build artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build KeiOS
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-15-multilib \
            nasm \
            binutils \
            grub-common \
            grub-pc-bin \
            xorriso \
            mtools \
            cpio \
            file

      - name: Verify GCC C23 and multilib support
        run: |
          echo "TOOLCHAIN_PREFIX=" >> "$GITHUB_ENV"
          printf 'int main(void) { return 0; }\n' | gcc-15 -std=c23 -m32 -ffreestanding -nostdlib -x c -c -o /tmp/keios-gcc-m32-check.o -
          ld -m elf_i386 --version

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Show toolchain versions
        run: |
          gcc-15 --version
          "${TOOLCHAIN_PREFIX}as" --version
          "${TOOLCHAIN_PREFIX}ld" --version
          nasm -v
          cargo --version
          rustc --version
          make --version

      - name: Build project with build.py
        run: |
          python3 build.py --clean-build "TOOLCHAIN_PREFIX=$TOOLCHAIN_PREFIX" "CC=gcc-15"

      - name: Run project healthcheck
        run: |
          python3 healthcheck.py

      - name: Validate build outputs
        run: |
          test -s keios.elf
          test -s keios.iso
          file keios.elf
          file keios.iso
          grub-file --is-x86-multiboot keios.elf

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v5
        with:
          name: keios-i386-iso
          path: keios.iso
          if-no-files-found: error
          retention-days: 7

      - name: Upload kernel ELF
        uses: actions/upload-artifact@v5
        with:
          name: keios-i386-kernel
          path: keios.elf
          if-no-files-found: error
          retention-days: 7
